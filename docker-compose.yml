services:
  api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: talentfc_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/talentfc
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - talentfc_net

  mongo:
    image: mongo:latest
    container_name: talentfc_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - talentfc_net

volumes:
  mongo_data:
    driver: local

networks:
  talentfc_net:
    driver: bridge
