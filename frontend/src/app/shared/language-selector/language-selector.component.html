<!-- Seletor de Idiomas com Bandeiras -->
<div class="flex gap-3 items-center">
  @for (idioma of idiomas; track idioma.codigo) {
    <button
      type="button"
      (click)="definirIdioma(idioma.codigo)"
      [attr.aria-label]="'Idioma: ' + idioma.nome"
      [class.active]="idiomaAtivo() === idioma.codigo"
      class="flex items-center justify-center w-10 h-10 rounded-lg transition-all duration-300
             text-slate-400 hover:text-slate-200 hover:scale-110
             border border-transparent hover:border-white/20
             hover:bg-white/5 cursor-pointer"
      [class.bg-soccer-green/20]="idiomaAtivo() === idioma.codigo"
      [class.border-soccer-green/50]="idiomaAtivo() === idioma.codigo"
      [class.ring-2]="idiomaAtivo() === idioma.codigo"
      [class.ring-soccer-green/50]="idiomaAtivo() === idioma.codigo">
      <span class="text-2xl" [attr.aria-hidden]="true">{{ idioma.bandeira }}</span>
    </button>
  }
</div>
