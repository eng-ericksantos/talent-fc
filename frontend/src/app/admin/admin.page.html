@if (usuarioEmail()) {
  <div class="min-h-screen bg-soccer-dark p-4 space-y-6">
    <div class="flex items-center justify-between">
      <div class="space-y-1">
        <h1 class="text-xl font-bold text-slate-100">{{ 'ADMIN.DASHBOARD_TITLE' | translate }}</h1>
        <p class="text-xs text-slate-500">{{ usuarioEmail() }}</p>
      </div>
      <button
        (click)="logout()"
        class="text-slate-400 text-xs border border-slate-700/50 rounded-lg px-3 py-1.5 hover:border-slate-500 transition-colors">
        {{ 'ADMIN.LOGOUT' | translate }}
      </button>
    </div>

    <section class="bg-soccer-card rounded-2xl p-4 space-y-4 border border-white/5">
      <div class="space-y-1">
        <h2 class="text-soccer-green font-semibold text-sm uppercase tracking-wider">
          {{ 'ADMIN.ACTIVE_CYCLE' | translate }}
        </h2>
        <p class="text-slate-400 text-xs">{{ 'ADMIN.ACTIVE_CYCLE_DESC' | translate }}</p>
      </div>

      <div class="flex gap-2">
        @for (versao of [25, 26, 27]; track versao) {
          <button
            (click)="activeVersion.set(versao)"
            class="flex-1 py-2.5 rounded-xl text-sm font-semibold border transition-colors"
            [class]="activeVersion() === versao
              ? 'bg-soccer-green text-slate-900 border-soccer-green'
              : 'bg-slate-800 text-slate-400 border-slate-700/50'">
            FC {{ versao }}
          </button>
        }
      </div>

      <button
        (click)="atualizarScraper()"
        [disabled]="isSyncing()"
        class="w-full bg-soccer-green/10 text-soccer-green border border-soccer-green/30 font-semibold py-3 rounded-xl text-sm tracking-wide hover:bg-soccer-green/20 transition-colors"
        [class.opacity-50]="isSyncing()"
        [class.cursor-not-allowed]="isSyncing()">
        {{ isSyncing() ? ('ADMIN.SYNCING' | translate) : ('ADMIN.UPDATE_SCRAPER' | translate) }}
      </button>
    </section>
  </div>
} @else {
  <div class="min-h-screen bg-soccer-dark flex items-center justify-center p-4">
    <div class="text-center space-y-4">
      <p class="text-slate-400 text-sm">{{ 'ADMIN.ACESSO_NEGADO' | translate }}</p>
      <button (click)="logout()" class="text-soccer-green text-sm font-semibold hover:text-emerald-400">
        {{ 'LOGIN.ENTRAR' | translate }}
      </button>
    </div>
  </div>
}
