<div class="flex flex-col h-screen bg-soccer-dark">

  <!-- Cabeçalho -->
  <header class="shrink-0 flex justify-between items-center p-4 border-b border-slate-800 bg-soccer-dark gap-4">
    <!-- Logo -->
    <span class="font-extrabold text-2xl tracking-tight select-none flex-shrink-0">
      <span class="text-soccer-green">Talent</span><span class="text-white">FC</span>
    </span>

    <!-- Espaçador flexível -->
    <div class="flex-1"></div>

    <!-- Controles direitos (Language Selector + Logout) -->
    <div class="flex gap-4 items-center flex-shrink-0">
      <!-- Seletor de Idiomas -->
      <app-language-selector />

      <!-- Divisor visual -->
      <div class="h-6 w-px bg-slate-700/50"></div>

      <!-- Botão de logout com largura fixa -->
      @if (authService.isAuthenticated()) {
        <button
          type="button"
          (click)="authService.logout()"
          title="{{ 'HEADER.LOGOUT' | translate }}"
          class="flex items-center justify-center gap-2 w-12 h-10 flex-shrink-0 rounded-lg text-sm font-semibold text-slate-400 hover:text-red-400 hover:bg-red-500/5 transition-all duration-200 cursor-pointer border border-transparent hover:border-red-500/30"
          [attr.aria-label]="'HEADER.LOGOUT' | translate">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      }
    </div>
  </header>

  <!-- Área de conteúdo -->
  <main class="flex-1 overflow-y-auto">
    <router-outlet />
  </main>

  <!-- Barra de navegação inferior -->
  <nav class="shrink-0 border-t border-slate-800 bg-soccer-card p-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
    <div class="flex items-center justify-around">

      <a routerLink="/tabs/home" routerLinkActive #rlaHome="routerLinkActive"
         [class]="rlaHome.isActive
           ? 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-soccer-green'
           : 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-white/40'">
        <ion-icon name="home-outline" class="text-2xl" />
        <span class="text-[10px] font-semibold uppercase tracking-wide">
          {{ 'TABS.HOME' | translate }}
        </span>
      </a>

      <a routerLink="/tabs/search" routerLinkActive #rlaSearch="routerLinkActive"
         [class]="rlaSearch.isActive
           ? 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-soccer-green'
           : 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-white/40'">
        <ion-icon name="search-outline" class="text-2xl" />
        <span class="text-[10px] font-semibold uppercase tracking-wide">
          {{ 'TABS.SEARCH' | translate }}
        </span>
      </a>

      <a routerLink="/tabs/favorites" routerLinkActive #rlaFavorites="routerLinkActive"
         [class]="rlaFavorites.isActive
           ? 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-soccer-green'
           : 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-white/40'">
        <ion-icon name="heart-outline" class="text-2xl" />
        <span class="text-[10px] font-semibold uppercase tracking-wide">
          {{ 'TABS.FAVORITES' | translate }}
        </span>
      </a>

      <!-- Aba Admin (apenas para administradores) -->
      @if (authService.isAdmin()) {
        <a routerLink="/tabs/admin" routerLinkActive #rlaAdmin="routerLinkActive"
           [class]="rlaAdmin.isActive
             ? 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-soccer-green'
             : 'flex flex-col items-center justify-center gap-1 px-4 py-1 text-white/40'">
          <ion-icon name="settings-outline" class="text-2xl" />
          <span class="text-[10px] font-semibold uppercase tracking-wide">
            {{ 'TABS.ADMIN' | translate }}
          </span>
        </a>
      }
